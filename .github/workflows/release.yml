name: Build release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Kindle packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp -a documents extensions ODINSTALUJ INSTRUKCJA.txt release/
          tar -czf InkDeck-update.tar.gz -C release .
          sha256sum InkDeck-update.tar.gz > InkDeck-update.tar.gz.sha256
          cd release
          zip -r ../InkDeck-${GITHUB_REF_NAME#v}.zip documents extensions ODINSTALUJ INSTRUKCJA.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            InkDeck-*.zip
            InkDeck-update.tar.gz
            InkDeck-update.tar.gz.sha256
