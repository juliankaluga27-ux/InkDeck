name: Build release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate application before packaging
        run: |
          for script in extensions/InkDeck/app/*.js; do node --check "$script"; done
          for script in documents/*.sh extensions/InkDeck/bin/*.sh; do sh -n "$script"; done
          python3 - <<'PYCODE'
          from pathlib import Path
          css = Path('extensions/InkDeck/app/style.css').read_text()
          assert css.count('{') == css.count('}'), 'Truncated stylesheet'
          for selector in ['.snakeBody', '.snakeCell', '.soccerNode', '.sudokuCell', '.nonogramCell', '.aiComposer']:
              assert selector + ' {' in css, 'Missing stylesheet rule: ' + selector
          PYCODE
      - name: Check updater behavior
        run: |
          node tests/updater-client-test.js
          python3 tests/updater-test.py
      - name: Build Kindle packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/documents
          cp -a documents/InkDeck.sh release/documents/
          cp -a extensions release/
          mkdir -p update-release/documents
          cp -a documents/InkDeck.sh update-release/documents/
          cp -a extensions update-release/
          cp -a extensions/InkDeck/app update-release/documents/InkDeck
          mv update-release/documents/InkDeck/main.page update-release/documents/InkDeck/index.html
          tar --format=ustar --owner=0 --group=0 --numeric-owner -cf InkDeck-update.tar -C update-release .
          gzip -1n InkDeck-update.tar
          sha256sum InkDeck-update.tar.gz > InkDeck-update.tar.gz.sha256
          : > InkDeck-update-manifest.txt
          while IFS= read -r path; do
            digest="$(sha256sum "$path" | awk '{ print $1 }')"
            printf '%s %s https://raw.githubusercontent.com/juliankaluga27-ux/InkDeck/%s/%s\n' "$digest" "$path" "$GITHUB_REF_NAME" "$path" >> InkDeck-update-manifest.txt
          done < <(find documents/InkDeck.sh extensions/InkDeck -type f -print | sort)
          cd release
          zip -r ../InkDeck-${GITHUB_REF_NAME#v}.zip documents extensions
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            InkDeck-*.zip
            InkDeck-update.tar.gz
            InkDeck-update.tar.gz.sha256
            InkDeck-update-manifest.txt
