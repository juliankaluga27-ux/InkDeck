name: Build release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Kindle packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/documents
          cp -a documents/InkDeck.sh release/documents/
          cp -a extensions release/
          mkdir -p update-release/documents
          cp -a documents/InkDeck.sh update-release/documents/
          cp -a extensions update-release/
          cp -a extensions/InkDeck/app update-release/documents/InkDeck
          mv update-release/documents/InkDeck/main.page update-release/documents/InkDeck/index.html
          tar -czf InkDeck-update.tar.gz -C update-release .
          sha256sum InkDeck-update.tar.gz > InkDeck-update.tar.gz.sha256
          cd release
          zip -r ../InkDeck-${GITHUB_REF_NAME#v}.zip documents extensions
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            InkDeck-*.zip
            InkDeck-update.tar.gz
            InkDeck-update.tar.gz.sha256
