<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InkDeck multiplayer</title><style>body{max-width:700px;margin:35px auto;padding:15px;font:20px Arial,sans-serif;color:#111;background:#fff}button{padding:15px;border:2px solid #111;background:#fff;font-size:20px}#status{white-space:pre-wrap}</style></head><body><h1>InkDeck multiplayer</h1><p>Serwer gry dla Kindle: szachy, warcaby i kółko i krzyżyk.</p><button id="check">SPRAWDŹ SERWER</button><p id="status">Sprawdź połączenie przed uruchomieniem gry online.</p><script>(function(){var button=document.getElementById('check'),status=document.getElementById('status');button.onclick=function(){var xhr=new XMLHttpRequest();button.disabled=true;status.textContent='Sprawdzanie…';xhr.open('POST','api.php',true);xhr.setRequestHeader('Content-Type','application/json');xhr.timeout=20000;xhr.onreadystatechange=function(){var data;if(xhr.readyState!==4)return;button.disabled=false;try{data=JSON.parse(xhr.responseText);status.textContent=data.ok?'Serwer działa. Obsługuje szachy, warcaby i kółko i krzyżyk.':data.error||'Błąd serwera.';}catch(e){status.textContent='Niepoprawna odpowiedź serwera (HTTP '+xhr.status+').';}};xhr.onerror=xhr.ontimeout=function(){button.disabled=false;status.textContent='Nie udało się połączyć z serwerem.';};xhr.send(JSON.stringify({action:'health'}));};}());</script></body></html>
